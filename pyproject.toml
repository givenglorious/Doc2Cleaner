[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "textcleaner"
version = "0.1.0"
description = "A lightweight library for cleaning text data from web scraping (Excel/CSV)."
requires-python = ">=3.10"
dependencies = [
    "pandas>=1.5",
    "openpyxl>=3.0",
]

[tool.setuptools]
packages = ["textcleaner"]
